<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141D" media="(prefers-color-scheme: dark)">
<script src="../assets/js/app.js"></script>
<title>Basse</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/musique.css">
<script src="../assets/js/musique/core.js" defer></script>
<script src="../assets/js/musique/batterie.js" defer></script>
<script src="../assets/js/musique/instrument-guitare.js" defer></script>
<script src="../assets/js/musique/instrument-piano.js" defer></script>
<script src="../assets/js/musique/instrument-basse.js" defer></script>
<script src="../assets/js/musique/clavier.js" defer></script>
<script src="../assets/js/musique/fiche.js" defer></script>
<script src="../assets/js/musique/gammes.js" defer></script>
<script src="../assets/js/musique/accordeur.js" defer></script>
<script src="../assets/js/musique/cordes.js" defer></script>
<script src="../assets/js/musique/composer.js" defer></script>
<script src="../assets/js/musique/harmonie.js" defer></script>
<script src="../assets/js/pages/basse.js" defer></script>
</head>
<body>
<main class="wrap">
  <nav class="topbar" aria-label="Fil d’Ariane"><ol class="crumbs"><li><a href="../index.html">Tools</a></li><li><a href="musique.html">Musique</a></li><li aria-current="page">Basse</li></ol></nav>

  <header>
    <h1 class="title">Basse</h1>
    <p class="sub">Fondamentale de chaque accord, basse virtuelle, notes du manche et gammes, accordeur, Composer (suite d’accords, rythmes, batterie) et suites harmoniques. Touchez un accord, une corde ou une note pour l’entendre.</p>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Sections de la page">
      <button type="button" role="tab" id="tab-accords" aria-controls="panel-accords" aria-selected="true">Accords</button>
      <button type="button" role="tab" id="tab-virtuelle" aria-controls="panel-virtuelle" aria-selected="false" tabindex="-1">Basse virtuelle</button>
      <button type="button" role="tab" id="tab-manche" aria-controls="panel-manche" aria-selected="false" tabindex="-1">Manche et gammes</button>
      <button type="button" role="tab" id="tab-accordeur" aria-controls="panel-accordeur" aria-selected="false" tabindex="-1">Accordeur</button>
      <button type="button" role="tab" id="tab-composer" aria-controls="panel-composer" aria-selected="false" tabindex="-1">Composer</button>
      <button type="button" role="tab" id="tab-harmonie" aria-controls="panel-harmonie" aria-selected="false" tabindex="-1">Suites harmoniques</button>
    </div>
    <div class="notation">
      <span class="muted">Notation</span>
      <div class="seg" role="group" aria-label="Notation des notes">
        <button type="button" data-notation="abc" aria-pressed="true">A B C</button>
        <button type="button" data-notation="do" aria-pressed="false">Do Ré Mi</button>
      </div>
    </div>
  </div>

  <!-- Accords : tous les accords, avec leurs schémas -->
  <section class="panel" id="panel-accords" role="tabpanel" aria-labelledby="tab-accords">
    <div id="sheetHost" class="panel"></div>
  </section>

  <!-- Basse virtuelle : cordes à balayer, puis la main gauche -->
  <section class="panel" id="panel-virtuelle" role="tabpanel" aria-labelledby="tab-virtuelle" hidden>
    <div id="padHost"></div>
    <div id="leftHost"></div>
  </section>

  <!-- Gammes -->
  <section class="panel" id="panel-manche" role="tabpanel" aria-labelledby="tab-manche" hidden>
    <div id="scalesHost" class="panel"></div>
  </section>

  <!-- Accordeur -->
  <section class="panel" id="panel-accordeur" role="tabpanel" aria-labelledby="tab-accordeur" hidden>
    <div id="tunerHost"></div>
  </section>

  <!-- Composer : noter une suite d'accords ou obtenir un accompagnement -->
  <section class="panel" id="panel-composer" role="tabpanel" aria-labelledby="tab-composer" hidden>
    <div id="composerHost" class="panel"></div>
  </section>

  <!-- Suites harmoniques : roue des accords -->
  <section class="panel" id="panel-harmonie" role="tabpanel" aria-labelledby="tab-harmonie" hidden>
    <div id="harmonieHost" class="panel"></div>
  </section>
</main>
</body>
</html>
