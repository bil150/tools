<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141D" media="(prefers-color-scheme: dark)">
<script src="../assets/js/app.js"></script>
<script>try { var p = JSON.parse(localStorage.getItem('tools:arts:pantin:theme')); if (p === 'gris' || p === 'papier' || p === 'contraste') document.documentElement.setAttribute('data-palette', p); } catch (e) {}</script>
<title>Pantin</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/pages/arts-atelier.css">
<link rel="stylesheet" href="../assets/css/pages/pantin.css">
<script type="module" src="../assets/js/pages/pantin.js"></script>
</head>
<body>
<main class="wrap">
  <nav class="topbar" aria-label="Fil d’Ariane"><ol class="crumbs"><li><a href="../index.html">Tools</a></li><li><a href="arts-plastiques.html">Arts plastiques</a></li><li aria-current="page">Pantin</li></ol></nav>

  <header>
    <h1 class="title">Pantin</h1>
  </header>

  <div class="app">
    <!-- Menu latéral : une icône par sous-vue, puis disposition et thème (comme Étude d'image) -->
    <div class="rail-col">
    <div class="rail">
    <div class="rail-tabs" role="tablist" aria-orientation="vertical" aria-label="Sections">
      <button type="button" role="tab" id="tabPoses" aria-controls="viewPantin" aria-selected="true" aria-label="Poses" title="Poses" data-label="Poses">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4" r="2"/><path d="M12 6v7M12 8l-5 3M12 8l5-4M12 13l-4 8M12 13l4 8"/></svg>
      </button>
      <button type="button" role="tab" id="tabCroquis" aria-controls="viewPantin" aria-selected="false" tabindex="-1" aria-label="Croquis chronométré" title="Croquis chronométré" data-label="Croquis chronométré">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
      </button>
      <button type="button" role="tab" id="tabLumiere" aria-controls="viewPantin" aria-selected="false" tabindex="-1" aria-label="Lumière et valeurs" title="Lumière et valeurs" data-label="Lumière et valeurs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    </div>
    <div class="rail rail-layout" id="layoutBox">
      <div class="rail-group" role="group" aria-label="Disposition">
        <button type="button" data-layout="below" aria-pressed="true" aria-label="Réglages sous le pantin" title="Réglages sous le pantin" data-label="Réglages dessous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15h18"/></svg>
        </button>
        <button type="button" data-layout="right" aria-pressed="false" aria-label="Réglages à droite du pantin" title="Réglages à droite" data-label="Réglages à droite">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
        </button>
        <button type="button" data-layout="focus" aria-pressed="false" aria-label="Pantin seul" title="Pantin seul" data-label="Pantin seul">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </div>
    <div class="rail rail-theme" id="themeBox">
      <div class="rail-group" role="group" aria-label="Thème">
        <button type="button" data-palette="site" aria-pressed="true" aria-label="Thème du site" title="Thème du site" data-label="Thème du site"><svg class="swatch" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="#E8ECF4"/><path d="M10 1.5a8.5 8.5 0 0 1 0 17z" fill="#14213D"/></svg></button>
        <button type="button" data-palette="gris" aria-pressed="false" aria-label="Gris neutre" title="Gris neutre" data-label="Gris neutre"><svg class="swatch" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="#D2D2D2"/><path d="M10 1.5a8.5 8.5 0 0 1 0 17z" fill="#6A6A6A"/></svg></button>
        <button type="button" data-palette="papier" aria-pressed="false" aria-label="Papier" title="Papier" data-label="Papier"><svg class="swatch" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="#EADFC8"/><path d="M10 1.5a8.5 8.5 0 0 1 0 17z" fill="#8A6D45"/></svg></button>
        <button type="button" data-palette="contraste" aria-pressed="false" aria-label="Contraste" title="Contraste" data-label="Contraste"><svg class="swatch" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="#FFFFFF"/><path d="M10 1.5a8.5 8.5 0 0 1 0 17z" fill="#000000"/></svg></button>
      </div>
    </div>
    </div>

    <div class="views">
      <section id="viewPantin" role="tabpanel" aria-labelledby="tabPoses">
        <div class="dash" id="dash" data-layout="below">
          <!-- Le pantin : faire glisser pour tourner autour, deux doigts ou molette pour zoomer -->
          <section class="card pane-stage" aria-label="Pantin">
            <div class="stage-frame">
              <canvas id="stage" tabindex="0" aria-label="Pantin en 3D : glissez pour tourner autour, molette ou deux doigts pour zoomer, flèches du clavier pour tourner"></canvas>
              <span class="timer-chip" id="timerChip" aria-hidden="true" hidden>1:00</span>
            </div>
            <div class="imgbar">
              <button type="button" class="btn" id="poseRand">Pose au hasard</button>
              <button type="button" class="btn ghost" id="exportBtn">Exporter en PNG</button>
              <span class="muted info"><b id="poseName"></b> · <span id="poseFam"></span></span>
            </div>
          </section>

          <div class="panels" id="panels">
            <div class="bt" id="tilePose">
              <h2>Pose</h2>
              <select id="poseSel" aria-label="Choisir une pose"></select>
              <div class="seg pose-nav" role="group" aria-label="Pose précédente ou suivante">
                <button type="button" id="posePrev" aria-label="Pose précédente">‹ Précédente</button>
                <button type="button" id="poseNext" aria-label="Pose suivante">Suivante ›</button>
              </div>
            </div>
            <div class="bt" id="tileVue">
              <h2>Vue</h2>
              <div class="seg wrapseg" role="group" aria-label="Points de vue">
                <button type="button" data-vue="face">Face</button>
                <button type="button" data-vue="troisquarts">Trois-quarts</button>
                <button type="button" data-vue="profil">Profil</button>
                <button type="button" data-vue="dos">Dos</button>
                <button type="button" data-vue="dessus">Dessus</button>
              </div>
              <p class="muted note">Glissez sur le pantin pour tourner autour.</p>
            </div>
            <div class="bt" id="tileProp">
              <div class="seg wrapseg" id="formeSeg" role="group" aria-label="Forme du pantin">
                <button type="button" data-v="homme">Masculin</button>
                <button type="button" data-v="femme">Féminin</button>
              </div>
              <label for="heads">Proportions : <b id="headsOut">7,5</b> têtes</label>
              <input type="range" id="heads" min="6" max="9" step="0.5" value="7.5">
              <p class="muted note">7,5 : réaliste · 8 et plus : idéalisé.</p>
            </div>
            <div class="bt" id="tileTimer" hidden>
              <h2>Croquis chronométré</h2>
              <output class="timer-out" id="timerOut" aria-live="off">1:00</output>
              <div class="seg wrapseg" id="dureeSeg" role="group" aria-label="Durée par pose">
                <button type="button" data-v="30">30 s</button>
                <button type="button" data-v="60">1 min</button>
                <button type="button" data-v="120">2 min</button>
                <button type="button" data-v="300">5 min</button>
              </div>
              <div class="bar">
                <button type="button" class="btn" id="timerGo" aria-pressed="false">Démarrer</button>
                <button type="button" class="btn ghost" id="timerReset">Remettre à zéro</button>
              </div>
            </div>
            <div class="bt" id="tileSeance" hidden>
              <h2>Séance</h2>
              <label class="switch"><input type="checkbox" id="optSeance"><span>Nouvelle pose à la fin du temps</span></label>
              <p class="muted note" id="seanceCount" aria-live="polite"></p>
              <p class="muted note">Espace : démarrer ou mettre en pause.</p>
            </div>
            <div class="bt" id="tileLumiere" hidden>
              <h2>Lumière</h2>
              <div class="seg wrapseg" role="group" aria-label="Éclairages types">
                <button type="button" data-lumiere="gauche">Gauche</button>
                <button type="button" data-lumiere="droite">Droite</button>
                <button type="button" data-lumiere="face">Face</button>
                <button type="button" data-lumiere="contre">Contre-jour</button>
                <button type="button" data-lumiere="dessus">Dessus</button>
                <button type="button" data-lumiere="rasante">Rasante</button>
              </div>
              <label for="lightAz">Direction : <b id="lightAzOut"></b></label>
              <input type="range" id="lightAz" min="0" max="360" step="5">
              <label for="lightEl">Hauteur : <b id="lightElOut"></b></label>
              <input type="range" id="lightEl" min="5" max="85" step="1">
            </div>
            <div class="bt" id="tileRendu" hidden>
              <h2>Valeurs</h2>
              <div class="seg wrapseg" id="renduSeg" role="group" aria-label="Rendu">
                <button type="button" data-v="continu">Modelé</button>
                <button type="button" data-v="3">3 valeurs</button>
                <button type="button" data-v="2">2 valeurs</button>
              </div>
              <div class="seg wrapseg" id="matiereSeg" role="group" aria-label="Matière">
                <button type="button" data-v="gris">Gris</button>
                <button type="button" data-v="bois">Bois</button>
              </div>
              <label class="switch"><input type="checkbox" id="optOmbre"><span>Ombre portée</span></label>
              <label class="switch"><input type="checkbox" id="optSol"><span>Grille au sol</span></label>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
  <footer>bil150 — <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">CC BY-NC-SA 4.0</a> — 2026</footer>
</main>
</body>
</html>
